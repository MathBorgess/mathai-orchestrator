[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathai-orchestrator"
version = "0.1.0"
description = "MathAI agent-team orchestrator — graph engineering above Claude Code CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
orch = "orch.cli:main"

[tool.setuptools.packages.find]
include = ["orch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
